# A2C from the previous assignment: longer returns for LunarLander, same 2M budget.
algorithm: a2c
env_id: LunarLander-v3
seed: 1
cuda: false
total_timesteps: 2000000
num_envs: 8
track: true
capture_video: true
save_model: true
checkpoint_every: 0
network: DiscreteActorCritic
network_kwargs:
  activation: Tanh
  hidden_layers_size: 64
a2c:
  learning_rate: 0.0007
  num_steps: 32
  gamma: 0.99
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  use_baseline: true
